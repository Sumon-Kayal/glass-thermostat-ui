<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Thermostat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="thermostat-ui">
    <div class="thermostat glass-panel">
      <div class="thermostat-inner">
        <div class="glass-noise"></div>

        <div class="scale-container left" id="scaleContainerLeft"></div>
        <div class="scale-container right" id="scaleContainerRight"></div>

        <div class="track" id="track">
          <div class="mercury" id="mercury"></div>
        </div>

        <div class="knob-zone">
          <div class="knob" id="knob"></div>
        </div>
      </div>
    </div>

    <div class="temp-readout">
      <div class="temp-value" id="tempValue">25°C / 77°F</div>
      <div class="temp-label">CURRENT TEMP</div>
      <div class="status-text" id="statusText">Comfortable</div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
